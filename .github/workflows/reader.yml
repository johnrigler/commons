name: Commons reader checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PHP CLI for publication checks
        run: |
          sudo apt-get update
          sudo apt-get install -y php8.3-cli
      - name: Check content, index behavior and frozen editions
        env:
          SB_PHP: php8.3
        run: node --test tests/core.mjs tests/portal.mjs tests/publication.mjs
      - name: Install development browser
        run: |
          npm install --prefix "$RUNNER_TEMP/commons-browser" playwright
          node "$RUNNER_TEMP/commons-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check portal in a browser
        run: |
          COMMONS_PLAYWRIGHT="$RUNNER_TEMP/commons-browser/node_modules/playwright" \
          COMMONS_SCREENSHOTS="$RUNNER_TEMP/commons-screenshots" node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commons-browser-views
          path: ${{ runner.temp }}/commons-screenshots

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reader
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: commons-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Export static site with frozen entry links resolved
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path
          shutil.copytree(
              Path.cwd(), Path(os.environ['RUNNER_TEMP']) / 'commons-pages',
              symlinks=False,
              ignore=shutil.ignore_patterns('.git', '.github', 'node_modules', 'tests'),
          )
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/commons-pages
      - name: Publish Commons
        id: deployment
        uses: actions/deploy-pages@v4
