name: Check versioned Commons editions

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'portal*.js'
      - 'portal.css'
      - 'verify.js'
      - 'VERSION'
      - 'portal.json'
      - 'scripts/publish-portal.mjs'
      - 'reading/**'
      - '.github/workflows/publish-checksum.yml'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and rebuild the static portal
        run: |
          node scripts/publish-portal.mjs
          git diff --exit-code -- index.html entry/
          test -z "$(git ls-files --others --exclude-standard)"
